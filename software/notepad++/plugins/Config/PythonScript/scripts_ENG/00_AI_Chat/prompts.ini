; Edit to add prompts. Use \n for newline. Used by jump_prompt_pick_ai / jump_ai_menu.

[prompts]
code_review = Review the following code; list issues and improvements:\n\n
summarize = Summarize the following in concise Chinese:\n\n
translate_en = Translate the following into fluent English:\n\n
translate_zh = Translate the following into fluent Chinese:\n\n
polish = Polish the following without changing meaning:\n\n
spoken_to_formal = Rewrite the following informal/spoken text into formal written language; keep meaning:\n\n
bullet_points = List key points from the following:\n\n
meeting_notes = Turn the following into meeting notes: topics, decisions, action items (owner/due if known), risks:\n\n
weekly_report = Turn the following work notes into a weekly report: done, in progress, blockers, next week:\n\n
explain_code = Explain what the following code does (in Chinese); highlight key logic and pitfalls:\n\n
pr_description = Draft a Pull Request description from the following change notes (Summary + Test plan):\n\n
