<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv='refresh' content='0; url=https://loading'>
<style>
/* reset */
body,div,dl,dt,dd,ul,ol,li,h1,h2,h3,h4,h5,h6,pre,code,form,fieldset,legend,textarea,p,blockquote,th,td,input,select,textarea,button {margin:0;padding:0}
fieldset,img {border:0 none}
dl,ul,ol,menu,li {list-style:none}
blockquote, q {quotes: none}
blockquote:before, blockquote:after,q:before, q:after {content:'';content:none}
input,select,textarea,button {vertical-align:middle}
input::-ms-clear {display:none}
button {border:0 none;background-color:transparent;cursor:pointer}
body {background:#fff}
body,th,td,input,select,textarea,button {font-size:12px;line-height:1.5;font-family:malgun gothic,dotum,sans-serif;color:#333} /* color값은 디자인가이드에 맞게사용 */
a {color:#333;text-decoration:none}
a:active, a:hover {text-decoration:underline}
a:active {background-color:transparent}
address,caption,cite,code,dfn,em,var {font-style:normal;font-weight:normal}

/* loading */
html, body {height:100%}
body {background-color:#2a2b33;display:flex;align-items:center;justify-content:center}
body {scrollbar-face-color:#23242a;scrollbar-3dlight-color:#23242a;scrollbar-highlight-color:#23242a;scrollbar-track-color:#16191e;scrollbar-arrow-color:#6c7481;scrollbar-shadow-color:#23242a;scrollbar-darkshadow-color:#161618}
.wrap_error {line-height:19px;color:#7d808e;background-color:#2a2b33;text-align:center}
.wrap_error .img_loading {display:block;width:44px;height:44px;margin:0 auto 22px;vertical-align:top}
</style>
</head>
<body>
<a href="https://loading" >
<div class="wrap_error">
	<img src="loading.gif" width="44" height="44" class="img_loading" alt="로딩 중...">
	프로그램을 불러오는 중입니다.<br>
	잠시만 기다려 주세요.
</div>
</a>
</body>
</html>
