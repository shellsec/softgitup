4215=Phát sóng giới hạn độ tuổi chỉ được cung cấp cho các PD đã được phê duyệt\ntrên 19 tuổi.\nMột số lời tục tĩu và hình ảnh bạo lực được phép.\n\nTuy nhiên, khi nội dung bao gồm các tài liệu như lời tục tĩu quá mức\nhoặc nội dung khiêu dâm thì sẽ bị xử lý mà không cần thông báo.\nNgoài ra, bạn có thể phải đối mặt với nhiều hình phạt khác nhau theo luật hiện hành.
